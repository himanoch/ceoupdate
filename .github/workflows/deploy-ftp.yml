name: Deploy Chatto Bot via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI validation
        run: npm run ci

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git/**
            **/node_modules/**
            **/scratch/**
            **/tests/**
            **/docs/**
            **/*.md
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.gif
            **/*.webp
            **/*.zip
            **/.github/**

      - name: Post-deploy note
        run: |
          echo "Deployment finished. Ensure your host runs 'npm install --production' and restarts the Node app manually or via a hosting restart hook."
